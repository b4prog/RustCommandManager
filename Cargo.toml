[package]
name = "rcm"
version = "0.1.0"
edition = "2024"
description = "Run named command sets from a user TOML configuration"
license = "MIT"
repository = "https://github.com/b4prog/RustCommandManager"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", default-features = false }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.23"
toml = "0.9"
unicode-width = "0.2"
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
filedescriptor = "0.8"
portable-pty = "0.9"

[lints.rust]
unsafe_code = "forbid"
